[project]
name = "importguard"
version = "0.1.0"
description = "Catch AI-hallucinated imports and function calls before you run the code"
requires-python = ">=3.9"
dependencies = [
    "typer",
    "rich"
]

[project.optional-dependencies]
test = [
    "pytest",
    "requests"
]

[project.scripts]
importguard = "importguard_app.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"